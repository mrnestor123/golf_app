<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>IA Caddy</title>
    <script src="https://unpkg.com/mithril/mithril.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Lexend:wght@400;500;600;700&amp;display=swap" rel="stylesheet"/>
    <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined" rel="stylesheet"/>
    
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />

    <style>
        body {
            margin: 0;
            font-family: 'Lexend', sans-serif;
            background-color: #121212;
            color: #ffffff;
            /* Disable scrolling completely */
            overflow: hidden;
            height: 100vh;
            width: 100vw;
        }

        html {
            /* Prevent any scrolling on the root element */
            overflow: hidden;
            height: 100%;
            width: 100%;
        }

        /* Hide scrollbars completely across all browsers */
        * {
            -ms-overflow-style: none;  /* IE and Edge */
            scrollbar-width: none;     /* Firefox */
        }
        
        *::-webkit-scrollbar {
            display: none;             /* Chrome, Safari, Opera */
        }

        /* Prevent pull-to-refresh and other mobile gestures */
        body {
            overscroll-behavior: none;
            touch-action: pan-x pan-y;
            -webkit-overflow-scrolling: touch;
        }


    
    </style>

</head>
<body>
    <script src="https://unpkg.com/lucide@latest"></script>
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>


    <script src="dist/index.js" type="module"></script>

</body>
</html>
